name: Build Cliamp for ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go and Build
        run: |
          # 1. Instal Go langsung dari repository Ubuntu
          sudo apt-get update
          sudo apt-get install -y golang-go
          
          # 2. Clone repository asli cliamp
          git clone https://github.com/bjarneo/cliamp.git
          cd cliamp
          
          # 3. Kompilasi biner khusus arm64 untuk Termux
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../cliamp-arm64
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliamp-binary-arm64
          path: cliamp-arm64
          
