# EXPERIMENTAL: builds bjarneo/cliamp for linux/arm64 WITHOUT removing
# Spotify support, to test whether go-librespot's build constraint only
# excludes GOOS=android specifically (as suspected) rather than being
# broken on linux/arm64 in general. If this succeeds, the Spotify
# provider should work like any other cliamp feature under proot-distro
# (its actual login/auth flow is untested separately from this).
#
# See build-cliamp-nospotify-termux.yml for the "known good" variant
# with Spotify removed, and README.md for background.
name: Build cliamp Android Native (linux/arm64) [experimental]

on:
  workflow_dispatch:
    inputs:
      cliamp_ref:
        description: "cliamp branch/tag/commit to build"
        required: false
        default: "main"

jobs:
  build-linux-arm64-with-spotify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cliamp
        uses: actions/checkout@v4
        with:
          repository: bjarneo/cliamp
          ref: ${{ github.event.inputs.cliamp_ref }}
          path: cliamp

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Cross-compile for linux/arm64 inside arm64 container (Spotify included)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}/cliamp:/src" \
            -w /src \
            golang:1.25-trixie \
            bash -c "
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                libasound2-dev libflac-dev libvorbis-dev libogg-dev libmpg123-dev
              export GOTOOLCHAIN=auto
              CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
                go build -buildvcs=false -trimpath -ldflags='-s -w' -o cliamp-linux-arm64-with-spotify .
            "

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliamp-linux-arm64-with-spotify
          path: cliamp/cliamp-linux-arm64-with-spotify
          
