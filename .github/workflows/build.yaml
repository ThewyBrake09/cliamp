name: Build mpv (Ubuntu AMD64)

on:
  workflow_dispatch:
  push:
    tags:
      - "mpv-v*"

permissions:
  contents: read

concurrency:
  group: build-mpv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mpv x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout mpv-build
        uses: actions/checkout@v4
        with:
          repository: mpv-player/mpv-build
          ref: master
          path: mpv-build

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cmake \
            git \
            ladspa-sdk \
            libasound2-dev \
            libass-dev \
            libbluray-dev \
            libbs2b-dev \
            libcdio-paranoia-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libfribidi-dev \
            libgl-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            liblcms2-dev \
            liblua5.2-dev \
            libmujs-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            librubberband-dev \
            libuchardet-dev \
            libunibreak-dev \
            libva-dev \
            libvdpau-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxpresent-dev \
            libxrandr-dev \
            libxss-dev \
            libxv-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libplacebo-dev \
            libzimg-dev \
            meson \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            yasm \
            zlib1g-dev

      - name: Build mpv
        working-directory: mpv-build
        run: |
          ./rebuild -j2

      - name: Verify binary
        working-directory: mpv-build
        run: |
          test -x mpv/build/mpv

          file mpv/build/mpv
          mpv/build/mpv --version

          mkdir -p ../artifact

          cp mpv/build/mpv ../artifact/mpv
          strip ../artifact/mpv || true

          ldd ../artifact/mpv \
            > ../artifact/shared-libraries.txt || true

          ../artifact/mpv --version \
            > ../artifact/version.txt

          printf '%s\n' \
            "Target: Ubuntu 24.04 AMD64" \
            "Architecture: x86_64" \
            "Source: mpv-player/mpv-build" \
            > ../artifact/build-info.txt

      - name: Package artifact
        run: |
          tar -czf mpv-ubuntu-amd64.tar.gz \
            -C artifact .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-ubuntu-amd64
          path: mpv-ubuntu-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
