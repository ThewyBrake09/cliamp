name: Build mpv (Ubuntu AMD64)

on:
  workflow_dispatch:
  push:
    tags:
      - "mpv-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build mpv x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout mpv source
        uses: actions/checkout@v4
        with:
          repository: mpv-player/mpv
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libplacebo-dev \
            libass-dev \
            libbluray-dev \
            libcdio-paranoia-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libjack-jackd2-dev \
            libjpeg-dev \
            liblcms2-dev \
            liblua5.2-dev \
            libmujs-dev \
            libopenal-dev \
            libuchardet-dev \
            libva-dev \
            libvdpau-dev \
            libvulkan-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxv-dev \
            libwayland-dev \
            wayland-protocols \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xkb-dev \
            libxpresent-dev \
            libxvdpau-dev \
            libzimg-dev \
            libarchive-dev \
            libuchardet-dev \
            libunibreak-dev \
            libv4l-dev \
            libwebp-dev \
            libdvdnav-dev \
            libdvdread-dev

      - name: Configure build
        run: |
          meson setup build \
            --prefix=/usr/local \
            --buildtype=release \
            -Dlibmpv=true \
            -Dtests=false

      - name: Compile mpv
        run: |
          meson compile -C build

      - name: Stage binaries
        run: |
          mkdir -p artifact
          cp build/mpv artifact/mpv
          strip artifact/mpv || true

          ldd artifact/mpv > artifact/shared-libraries.txt || true

          {
            echo "mpv version:"
            artifact/mpv --version
            echo
            echo "Architecture:"
            uname -m
          } > artifact/build-info.txt

          tar -czf mpv-ubuntu-amd64.tar.gz -C artifact .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-ubuntu-amd64
          path: mpv-ubuntu-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
