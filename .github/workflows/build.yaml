name: Build cliamp ARM64

on:
  workflow_dispatch:
    inputs:
      cliamp_ref:
        description: "Test"
        required: true
        default: main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cliamp
        uses: actions/checkout@v4
        with:
          repository: ThewyBrake09/cliamp-termux
          ref: ${{ github.event.inputs.cliamp_ref }}
          path: cliamp

      - name: Verify source repository
        working-directory: cliamp
        run: |
          echo "=== SOURCE REPOSITORY ==="
          git remote -v

          echo
          echo "=== SOURCE REVISION ==="
          git log -1 --oneline
          git rev-parse HEAD

      - name: Build cliamp ARM64
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}/cliamp:/src" \
            -w /src \
            golang:1.25-trixie \
            bash -c "
              set -e

              apt-get update

              apt-get install -y --no-install-recommends \
                libasound2-dev \
                libflac-dev \
                libvorbis-dev \
                libogg-dev \
                libmpg123-dev

              export GOTOOLCHAIN=auto

              CGO_ENABLED=1 \
              GOOS=linux \
              GOARCH=arm64 \
              go build \
                -buildvcs=false \
                -trimpath \
                -ldflags='-s -w' \
                -o cliamp-linux-arm64-with-spotify .
            "

      - name: Verify binary
        working-directory: cliamp
        run: |
          echo "=== BINARY ==="
          ls -lh cliamp-linux-arm64-with-spotify

          echo
          echo "=== SHA256 ==="
          sha256sum cliamp-linux-arm64-with-spotify

          echo
          echo "=== FILE ==="
          file cliamp-linux-arm64-with-spotify

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: cliamp-linux-arm64-with-spotify
          path: cliamp/cliamp-linux-arm64-with-spotify
