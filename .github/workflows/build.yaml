name: Build Cliamp for ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cliamp Repository
        uses: actions/checkout@v4
        with:
          repository: bjarneo/cliamp

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Cliamp
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o cliamp-arm64
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliamp-binary-arm64
          path: cliamp-arm64
          
